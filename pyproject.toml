[project]
name = "srtlint"
version = "0.1.0"
description = "Strict-by-default checker for SRT subtitle files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "markl574" }]
dependencies = []

[project.scripts]
srtlint = "srtlint.cli:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["srtlint*"]
